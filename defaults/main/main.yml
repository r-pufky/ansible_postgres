---
# yamllint disable rule:line-length
###############################################################################
# Feature Flags
###############################################################################

# 1. Install application?
#
# Creates required default directories, users, install packages, download
# software, autogenerates config if not specified, update and start services.
#
# Default: True.
postgres_flg_install: true

# 2. Set configuration data?
#
# Overwrite config data directory sourced from postgres_srv_*. Stops service,
# deploys user config data, updates and starts services.
#
# Default: False.
postgres_flg_config: false

# 3. Enable scheduled server backup?
#
# See postgres_cfg_backup_*.
#
# Default: False
postgres_flg_backup: false

###############################################################################
# Service
###############################################################################

# Postgres Release.
#
# All versions are supported by the postgres Debian repository but may not be
# fully supported by the role.
#
# Versions (Schematic):
#       MAJOR: Unsafe - Only default version is supported; older versions may
#              be used at the risk of missing dependencies or configuration
#              parameters that are not supported.
#       MINOR: Safe - New functionality may not be properly supported in
#              configuration.
#       PATCH: Safe - Usually requires no role updates.
#   RECOMMEND: Only use latest stable release.
#
# Default: '17'.
#
# Reference:
# * https://www.postgresql.org/download/linux/debian/
postgres_srv_version: '17'

# Postgres conf.d to set.
#
# Ansible controller path to source conf.d files (treated as a jinja2 templates
# allowing for ansible variable interpretation). Overwrites existing config
# data in /etc/postgresql/{VERSION}/main/conf.d/*. Files not sourced will be
# removed.
#
# Required default postgres configuration is auto-generated if not set (see
# templates/default).
#
# postgres_srv_conf_d: 'host_vars/db.example.com/conf.d'
#
# Default: '' (use minimally configured default).
postgres_srv_conf_d: ''

# Postgres secure conf.d to set.
#
# Ansible controller path to source secure conf.d files (treated as a jinja2
# templates allowing for ansible variable interpretation). Overwrites existing
# config data in /etc/postgresql/{VERSION}/main/secure.conf.d/* with 0750:0640
# postgres_srv_user, postgres_srv_group permissions. Certificates, etc. should
# be included here and sourced from standard conf.d and configuration files.
# Files not sourced will be removed.
#
# postgres_srv_secure_conf_d: 'host_vars/db.example.com/secure.conf.d'
#
# Default: '' (use minimally configured default).
postgres_srv_secure_conf_d: ''

# Postgres environment to set.
#
# Ansible controller path to source environment (treated as a jinja2 template
# allowing for ansible variable interpretation). Overwrites existing
# /etc/postgresql/{VERSION}/main/environment.
#
# A default configuration is autogenerated if not provided (see
# templates/default).
#
# postgres_srv_environment: 'host_vars/db.example.com/environment'
#
# Default: '' (use minimally configured default).
postgres_srv_environment: ''

# Postgres pg_ctl.conf to set.
#
# Ansible controller path to source pg_ctl.conf (treated as a jinja2 template
# allowing for ansible variable interpretation). Overwrites existing
# /etc/postgresql/{VERSION}/main/pg_ctl.conf.
#
# A default configuration is autogenerated if not provided (see
# templates/default).
#
# postgres_srv_pg_ctl: 'host_vars/db.example.com/pg_ctl.conf'
#
# Default: '' (use minimally configured default).
postgres_srv_pg_ctl: ''

# Postgres pg_hba.conf to set.
#
# Ansible controller path to source pg_hba.conf (treated as a jinja2 template
# allowing for ansible variable interpretation). Overwrites existing
# /etc/postgresql/{VERSION}/main/pg_hba.conf.
#
# A default configuration is autogenerated if not provided (see
# templates/default).
#
# postgres_srv_pg_hba: 'host_vars/db.example.com/pg_hba.conf'
#
# Default: '' (use minimally configured default).
postgres_srv_pg_hba: ''

# Postgres pg_ident.conf to set.
#
# Ansible controller path to source pg_ident.conf (treated as a jinja2 template
# allowing for ansible variable interpretation). Overwrites existing
# /etc/postgresql/{VERSION}/main/pg_ident.conf.
#
# A default configuration is autogenerated if not provided (see
# templates/default).
#
# postgres_srv_pg_ident: 'host_vars/db.example.com/pg_ident.conf'
#
# Default: '' (use minimally configured default).
postgres_srv_pg_ident: ''

# Postgres postgresql.conf to set.
#
# Ansible controller path to source postgresql.conf (treated as a jinja2
# template allowing for ansible variable interpretation). Overwrites existing
# /etc/postgresql/{VERSION}/main/postgresql.conf.
#
# A default configuration is autogenerated if not provided (see
# templates/default).
#
# postgres_srv_postgresql: 'host_vars/db.example.com/postgresql.conf'
#
# Default: '' (use minimally configured default).
postgres_srv_postgresql: ''

# Postgres start.conf to set.
#
# Ansible controller path to source start.conf (treated as a jinja2 template
# allowing for ansible variable interpretation). Overwrites existing
# /etc/postgresql/{VERSION}/main/start.conf.
#
# A default configuration is autogenerated if not provided (see
# templates/default).
#
# postgres_cfg_pg_start: 'host_vars/db.example.com/start.conf'
#
# Default: '' (use minimally configured default).
postgres_srv_start: ''

# Custom postgres global environment profile.
#
# A default global bash environment profile is created setting PGDATA and
# appending the versioned binary utility location to PATH. For systems with
# multiple postgres versions running a custom profile is likely needed.
#
# Ansible controller path to source postgres (treated as a jinja2 template
# allowing for ansible variable interpretation). Overwrites existing
# /etc/profile.d/postgres. Be sure to set appropriate paths for Postgres
# configuration settings.
#
# postgres_srv_profile: 'host_vars/db.example.com/profile.d/postgres'
#
# Default: '' (auto generate profile).
postgres_srv_profile: ''

# Purge Postgres data directories on package removal?
#
# Enable 'apt remove postgres-{VERSION}' purging database data.
# DATA DESTRUCTIVE. Removes DB's, state, and config on Debian package removal.
#
# Default: False (Debian default).
postgres_srv_purge: false

# Enable automatic major-version upgrades via APT?
#
# Not recommended. Major version upgrades via APT typically need a migration
# plan.
#
# Default: False (Debian default).
postgres_srv_upgrade: false

# User that Postgres will run under.
#
# 'postgres' will automatically be created using vars/main.yml if required.
# All other accounts are checked for existence.
#
# Default: 'postgres'.
postgres_srv_user: 'postgres'

# Group that Postgres will run under.
#
# 'postgres' will automatically be created using vars/main.yml if required.
# All other accounts are checked for existence.
#
# Default: 'postgres'.
postgres_srv_group: 'postgres'

# Default role connection options for postgres_srv_user.
#
# Postgres is managed through the postgres_srv_user effectively using these
# default values for postgres operations. postgres_srv_user is configured to
# connect via unix socket connection with minimal changes by default.
#
# Use community.postgresql.postgresql_user parameters as dictionary keys with
# default values matching specified parameters. Valid keys are:
# * ca_cert
# * connect_params
# * login_host
# * login_password
# * login_port
# * login_unix_socket
# * login_user
# * session_role
# * ssl_cert
# * ssl_key
# * ssl_mode
#
# postgres_srv_connection:
#     dict - Encapsulated community.postgresql.postgresql_user dictionary.
#
# Default:
#   login_host: 'localhost'
#   login_unix_socket: '/var/run/postgresql'
#   login_user: '{{ postgres_srv_user }}'
#   port: 5432
#
# Reference:
# * https://docs.ansible.com/projects/ansible/latest/collections/community/postgresql/postgresql_user_module.html
postgres_srv_connection:
  login_host: 'localhost'
  login_unix_socket: '/var/run/postgresql'
  login_user: '{{ postgres_srv_user }}'
  port: 5432

###############################################################################
# Config
###############################################################################

# Database users to manage.
#
# Users are managed using connection options from postgres_srv_connection
# unless explicitly overridden. Users are modified before Databases allowing
# for database definitions to correctly reference users.
#
# Use community.postgresql.postgresql_user parameters as dictionary keys with
# default values matching specified parameters unless noted. Additional
# attributes are fully defined.
#
# postgres_cfg_users:
#     list of dict - Encapsulated community.postgresql.postgresql_user dicts.
#   - extensions: dict - User (role) extensions.
#       database_owner: list of str - Database names to change all ownership of
#               objects to user.name. Uses shell script to set tables,
#               sequences, and views without the need of owner/priv use.
#           Default: [].
#       owner: list of dict - Use community.postgresql.postgresql_owner
#               parameters as dictionary keys with default values matching
#               specified parameters unless noted. Options from user definition
#               are automatically included.
#           Default: [].
#       priv: list of dict - Use community.postgresql.postgresql_privs
#               parameters as dictionary keys with default values matching
#               specified parameters unless noted. Options from user definition
#               are automatically included.
#           Default: [].
#
# postgres_cfg_users:
#   - name: 'example'
#     host: 'localhost'
#     password: 'example'
#     state: 'present'
#     append_privs: false
#     encrypted: true
#     extensions:
#       database_owner:
#         - 'some_app'
#       owner:
#         - login_db: 'some_other_app'
#           new_owner: 'example'
#           reassign_owned_by: 'old_owner'
#       priv:
#         - login_db: 'postgres'
#           privs: 'ALL'
#           type: 'database'
#
# Default: [].
#
# Reference:
# * https://stackoverflow.com/questions/1348126/postgresql-modify-owner-on-all-tables-simultaneously-in-postgresql
# * https://docs.ansible.com/ansible/latest/collections/community/postgresql/postgresql_user_module.html
# * https://docs.ansible.com/ansible/latest/collections/community/postgresql/postgresql_owner_module.html
# * https://docs.ansible.com/ansible/latest/collections/community/postgresql/postgresql_privs_module.html
postgres_cfg_users: []

# Databases to manage.
#
# Databases are managed using connection options from postgres_srv_connection
# unless explicitly overridden.
#
# Use community.postgresql.postgresql_db parameters as dictionary keys with
# default values matching specified parameters unless noted. Additional
# attributes are fully defined.
#
# postgres_cfg_dbs:
#     list of dict - Encapsulated community.postgresql.postgresql_db dicts.
#   - encoding: str - Encoding mode of database.
#         Default: 'UTF-8'.
#     lc_collate: str - Collation order (LC_COLLATE) to use in the database
#           must match collation order of template database unless template0 is
#           used as template. Locales will automatically be generated and
#           installed.
#         Default: 'en_US.UTF-8'.
#     lc_ctype: str - Character classification (LC_CTYPE) to use in the
#           database (e.g. lower, upper, …). Must match LC_CTYPE of template
#           database unless template0 is used as template. Locales will
#           automatically be generated and installed.
#         Default: 'en_US.UTF-8'.
#     owner: str - Name of the user (role) to set as owner of the database.
#         Default: postgres_srv_user.
#     template: str - Template used to create the database.
#         Default: 'template0'.
#     extensions: dict - Database role extensions.
#       db_import: dict - Database import options.
#         enable: bool - Enable imports?
#               Import occurs only when database is created and this option is
#               enabled.
#             Default: False.
#         source: str - database to import.
#               Source file is copied to /tmp, imported, then removed.
#             Values:
#               {PATH}: Sourced from ansible controller; must NOT be compressed
#                       archive.
#
#                       source: 'host_vars/db.example.com/data/skeleton.sql'
#                   '': Use 'latest' individual DB backup from
#                       postgres_cfg_backup_d (default).
#             Default: '' (use latest backup).
#
# postgres_cfg_dbs:
#   - name: 'example_import_from_controller'
#     state: 'present'
#     extensions:
#       db_import:
#         enable: true
#         source: 'host_vars/db.example.com/data/skeleton_db.sql'
#   - name: 'example_import_from_latest_backup'
#     state: 'present'
#     extensions:
#       db_import:
#         enable: true
#
# Default: [].
#
# Reference:
# * https://docs.ansible.com/ansible/latest/collections/community/postgresql/postgresql_db_module.html
postgres_cfg_dbs: []

# Backup
###############################################################################
# Backups are done through psql and executed as postgres with local unix socket
# credentials from postgres_srv_connection on a schedule. Databases are date
# stamped, linked to 'latest', removing 'other' permissions.
#
# All backups except 'latest' are compressed with tar.xz.
#
# Disable if custom or complex backups are needed.

# Enable all database backups?
#
# May be used with postgres_cfg_backup_individual.
#
# All databases will be backed up to:
# * postgres_cfg_backup_d/all-databases-{DATE}.sql
# * postgres_cfg_backup_d/all-databases-latest.sql ->
#   postgres_cfg_backup_d/all-databases-{DATE}.sql
#
# Default: True.
postgres_cfg_backup_all: true

# Enable individual database backups?
#
# May be used with postgres_cfg_backup_all.
#
# All databases will be backed up individually to:
# * postgres_cfg_backup_d/{DB}-{DATE}.sql
# * postgres_cfg_backup_d/{DB}-latest.sql ->
#   postgres_cfg_backup_d/{DB}-{DATE}.sql
#
# Default: True.
postgres_cfg_backup_individual: true

# Backup location.
#
# Directory created with postgres_srv_user:postgres_srv_group permissions.
#
# Default: '/srv/postgres_backup'.
postgres_cfg_backup_d: '/srv/postgres_backup'

# Backup file owner. Default: 'root'.
postgres_cfg_backup_owner: 'root'

# Backup file group. Default: 'root'.
postgres_cfg_backup_group: 'root'

# Set backup schedule.
#
# Uses systemd TIME specification.
#
# Default: 'weekly'
#
# Reference:
# * https://www.freedesktop.org/software/systemd/man/latest/systemd.time.html
postgres_cfg_backup_schedule: 'weekly'

# List of pg_dumpall pg_dump options for backing up databases.
#
# Default:
#   - '--no-owner'
#   - '--no-privileges'
#   - '--username=postgres'
#   - '--no-password'
#   - '--host=/var/run/postgresql'
#   - '--port=5432'
#
# Reference:
# * https://www.postgresql.org/docs/current/app-pgdump.html
postgres_cfg_backup_opts:
  - '--no-owner'
  - '--no-privileges'
  - '--username=postgres'
  - '--no-password'
  - '--host=/var/run/postgresql'
  - '--port=5432'
