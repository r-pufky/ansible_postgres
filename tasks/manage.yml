---
###############################################################################
# Manage Postgres
###############################################################################
# Manage user accounts & initial databases.
# * Create users first so database definitions can correctly reference users.
# * Create/import databases if they do not exist.
# * Set user permissions on databases.
#
# Created users using the connection options specified in the user object,
# defaulting to postgres_srv_connection options for connection only options if
# needed:
# * ca_cert
# * connect_params
# * login_host
# * login_password
# * login_port
# * login_unix_socket
# * login_user
# * session_role
# * ssl_cert
# * ssl_key
# * ssl_mode

- name: 'Manage | users'
  community.postgresql.postgresql_user:
    ca_cert: '{{ (

          user.ca_cert
          if user.ca_cert is defined else
          postgres__srv._connection._ca_cert
        ) | default(omit)
      }}'
    comment: '{{ user.comment | default(omit) }}'
    configuration: '{{ user.configuration | default({}) }}'
    conn_limit: '{{ user.conn_limit | default(omit) }}'
    connect_params: '{{ (

          user.connect_params
          if user.connect_params is defined else
          postgres__srv._connection.connect_params
        ) | default({})
      }}'
    encrypted: '{{ user.encrypted | default(true) }}'
    expires: '{{ user.expires | default(omit) }}'
    fail_on_user: '{{ user.fail_on_user | default(true) }}'
    login_db: '{{ user.login_db | default("") }}'
    login_host: '{{ (

          user.login_host
          if user.login_host is defined else
          postgres__srv._connection.login_host
        ) | default(postgres__cfg._login_host)
      }}'
    login_password: '{{ (

          user.login_password
          if user.login_password is defined else
          postgres__srv._connection.login_password
        ) | default(omit)
      }}'
    login_port: '{{ (

          user.login_port
          if user.login_port is defined else
          postgres__srv._connection.login_port
        ) | default(postgres__cfg._port)
      }}'
    login_unix_socket: '{{ (

          user.login_unix_socket
          if user.login_unix_socket is defined else
          postgres__srv._connection.login_unix_socket
        ) | default(postgres__cfg._socket_d)
      }}'
    login_user: '{{ (

          user.login_user
          if user.login_user is defined else
          postgres__srv._connection.login_user
        ) | default(postgres__cfg._login_user)
      }}'
    name: '{{ user.name }}'
    no_password_changes: '{{ user.no_password_changes | default(false) }}'
    password: '{{ user.password | default(omit) }}'
    quote_configuration_values:
      '{{ user.quote_configuration_values | default(true) }}'
    reset_unspecified_configuration:
      '{{ user.reset_unspecified_configuration | default(false) }}'
    role_attr_flags: '{{ user.role_attr_flags | default("") }}'
    session_role: '{{ (

          user.session_role
          if user.session_role is defined else
          postgres__srv._connection.session_role
        ) | default(omit)
      }}'
    ssl_cert: '{{ (

          user.ssl_cert
          if user.ssl_cert is defined else
          postgres__srv._connection.ssl_cert
        ) | default(omit)
      }}'
    ssl_key: '{{ (

          user.ssl_key
          if user.ssl_key is defined else
          postgres__srv._connection.ssl_key
        ) | default(omit)
      }}'
    ssl_mode: '{{ (

          user.ssl_mode
          if user.ssl_mode is defined else
          postgres__srv._connection.ssl_mode
        ) | default("prefer")
      }}'
    state: '{{ user.state | default("present") }}'
    trust_input: '{{ user.trust_input | default(true) }}'
  become: true
  become_user: '{{ postgres__srv._user }}'
  loop: '{{ postgres__cfg._users }}'
  loop_control:
    loop_var: 'user'
    label: '{{ user.name }}'

- name: 'Manage | DB'
  ansible.builtin.include_tasks: 'manage_db.yml'
  loop: '{{ postgres__cfg._dbs }}'
  loop_control:
    loop_var: 'db'
    label: '{{ db.name }}'

- name: 'Manage | extensions'
  ansible.builtin.include_tasks: 'extensions.yml'
  loop: '{{ postgres__cfg._users }}'
  loop_control:
    loop_var: 'user'
    label: '{{ user.name }}'
