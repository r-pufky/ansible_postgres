  when: postgres__etc._postgresql | length > 0
  ansible.builtin.template:
    src: '{{ postgres__srv._postgresql }}'
    dest: '{{ postgres__etc._postgresql }}'
    owner: '{{ postgres__srv._user }}'
    group: '{{ postgres__srv._group }}'
