- name:
    '{{ "Config | filesystem | set " ~ postgres__etc._start }}'
  when: postgres__etc._start | length > 0
  ansible.builtin.template:
    src: '{{ postgres__srv._start }}'
    dest: '{{ postgres__etc._start }}'
    owner: '{{ postgres__srv._user }}'
    group: '{{ postgres__srv._group }}'
    mode: '0644'
